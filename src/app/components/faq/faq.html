<section class="faq-section py-5">
  <div class="container">

    <div class="text-center mb-5">
      <h2 class="faq-titulo">Preguntas Frecuentes</h2>
      <p class="faq-subtitulo text-muted">Todo lo que necesitás saber antes de comprar</p>
    </div>

    <div class="faq-grid">
      @for (p of preguntas(); track $index; let i = $index) {
        <div class="faq-item" [class.open]="p.abierta">
          <button class="faq-pregunta" (click)="toggle(i)">
            <span>{{ p.pregunta }}</span>
            <i class="bi" [class.bi-chevron-down]="!p.abierta" [class.bi-chevron-up]="p.abierta"></i>
          </button>
          <div class="faq-respuesta" [class.visible]="p.abierta">
            <p>{{ p.respuesta }}</p>
          </div>
        </div>
      }
    </div>

    <div class="faq-cta text-center mt-5">
      <p class="text-muted mb-3">¿Tenés otra consulta?</p>
      <a class="btn-faq-contacto" routerLink="/sobre-nosotros">
        <i class="bi bi-chat-dots me-2"></i>Contactanos
      </a>
    </div>

  </div>
</section>
