<nav class="navbar navbar-expand-lg navbar-light sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/inicio" (click)="closeMenu()">
      <i class="fas fa-shoe-prints me-2 brand-icon"></i>
      <div class="brand-wrapper">
        <span class="brand-del-rey">Del Rey</span>
        <span class="brand-calzados">Calzados</span>
      </div>
    </a>

    <button class="navbar-toggler border-0" type="button" (click)="toggleMenu()" [class.active]="!isMenuCollapsed">
      <span class="navbar-toggler-icon">
        <span class="hamb-line"></span>
        <span class="hamb-line"></span>
        <span class="hamb-line"></span>
      </span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav ms-auto gap-lg-3 py-3 py-lg-0 align-items-center">

        <!-- === CLIENTE: visible para todos (no admin) === -->
        <ng-container *ngIf="!auth.isAdmin()">
          <li class="nav-item"><a class="nav-link" routerLink="/inicio" routerLinkActive="active-link" (click)="closeMenu()">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/catalogo" routerLinkActive="active-link" (click)="closeMenu()">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/sobre-nosotros" routerLinkActive="active-link" (click)="closeMenu()">Bio</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/como-funciona" routerLinkActive="active-link" (click)="closeMenu()">FAQ</a></li>
        </ng-container>

        <!-- === ADMIN: solo visible para admin === -->
        <ng-container *ngIf="auth.isAdmin()">
          <li class="nav-item nav-admin-label"><span class="nav-label-admin">ADMIN</span></li>
          <li class="nav-item"><a class="nav-link" routerLink="/gestion" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()"><i class="bi bi-box-seam me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/gestion" [queryParams]="{tab:'pedidos'}" routerLinkActive="active-link" (click)="closeMenu()"><i class="bi bi-receipt me-1"></i>Pedidos</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/gestion" [queryParams]="{tab:'estadisticas'}" routerLinkActive="active-link" (click)="closeMenu()"><i class="bi bi-graph-up me-1"></i>Estadísticas</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/catalogo" routerLinkActive="active-link" (click)="closeMenu()">Catálogo</a></li>
          <li class="nav-item nav-divider"></li>
          <li class="nav-item"><a class="nav-link text-danger" (click)="closeMenu(); auth.logout()" style="cursor:pointer;"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ng-container>

        <!-- CARRITO: siempre visible -->
        <li class="nav-item">
          <button type="button" class="btn btn-cart-premium position-relative ms-lg-2"
                  (click)="openCart(); closeMenu()">
            <i class="bi bi-cart3"></i>
            <span *ngIf="carrito.cantidadTotal() > 0"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm badge-cart">
              {{ carrito.cantidadTotal() }}
            </span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
